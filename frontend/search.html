<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyEase | Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
    
        <nav class="nav">
            <h1 class="logo">Sky<span class="ease">Ease</span></h1>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="search.html" class="current">Search Flights</a></li>
                <li><a href="booking.html">Book Flights</a></li>
                <li><a href="reservations.html">My Reservations</a></li>
                <li><a href="profile.html" >User Profile</a></li>
                <li><a href="admin-dashboard.html">Admin Panel</a></li>
                <li><a class="login" href="#">Login</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>


    <main class="search-shell">
        <section class="search-container">
            <form class="search-card" action="results.html" method="get">
                <p class="eyebrow">SkyEase</p>
                <h1><i class="bi bi-search"></i> Search flights</h1>
                <p class="search-copy">Plan your trip quickly with a clean, centered search panel.</p>

                <div class="form-grid">
                    <label for="origin"><i class="bi bi-airplane"></i> Origin Airport</label>
                    <select name="origin" id="origin">
                        <option value="NAIA">Ninoy Aquino International Airport (NAIA)</option>
                        <option value="CHG">Clark International Airport (CHG)</option>
                        <option value="DVO">Francisco Bangoy International Airport (DVO)</option>
                    </select>

                    <label for="destination"><i class="bi bi-airplane"></i> Destination Airport</label>
                    <select name="destination" id="destination">
                        <option value="NAIA">Ninoy Aquino International Airport (NAIA)</option>
                        <option value="CHG">Clark International Airport (CHG)</option>
                        <option value="DVO">Francisco Bangoy International Airport (DVO)</option>
                    </select>

                    <div class="trip-type-row">
                        <label><i class="bi bi-info-circle"></i> Trip Type</label>
                        <div class="select-container">
                            <input type="radio" id="one_way" name="trip_type" value="one_way">
                            <label for="one_way">One Way</label>
                            <input type="radio" id="round_trip" name="trip_type" value="round_trip" checked>
                            <label for="round_trip">Round Trip</label>
                        </div>
                    </div>

                    <label for="departure_date"><i class="bi bi-calendar"></i> Departure Date</label>
                    <input type="date" id="departure_date" name="departure_date">

                    <label for="return_date"><i class="bi bi-calendar"></i> Return Date</label>
                    <input type="date" id="return_date" name="return_date">

                    <label for="passengers"><i class="bi bi-person"></i> Passengers</label>
                    <select name="passengers" id="passengers">
                        <option value="1">1 Passenger</option>
                        <option value="2">2 Passengers</option>
                        <option value="3">3 Passengers</option>
                        <option value="4">4 Passengers</option>
                    </select>

                    <label for="cabin_class"><i class="bi bi-building"></i> Cabin Class</label>
                    <select name="cabin_class" id="cabin_class">
                        <option value="economy">Economy</option>
                        <option value="business">Business</option>
                        <option value="first_class">First Class</option>
                    </select>
                </div>

                <details class="accordion-container">
                    <summary><i class="bi bi-gear"></i> Advanced search options</summary>
                    <div class="accordion-panel">
                        <label for="airline"><i class="bi bi-airplane"></i> Airline</label>
                        <select name="airline" id="airline">
                            <option value="philippine_airlines">Philippine Airlines</option>
                            <option value="cebu_pacific">Cebu Pacific</option>
                            <option value="air_asia">Air Asia</option>
                        </select>

                        <label class="checkbox-row" for="direct_flight">
                            <input type="checkbox" id="direct_flight" name="direct_flight" value="yes">
                            <i class="bi bi-check-circle"></i> Direct flight only
                        </label>

                        <label class="checkbox-row" for="flexible_dates">
                            <input type="checkbox" id="flexible_dates" name="flexible_dates" value="yes">
                            <i class="bi bi-check-circle"></i> Flexible dates
                        </label>

                        <label for="price_range"><i class="bi bi-currency-dollar"></i>  Range</label>
                        <input type="text" id="price_range" name="price_range" placeholder="e.g. 5000-10000">
                    </div>
                </details>

                <button type="submit" class="search-button">Search flights</button>
            </form>
        </section>
    </main>
</body>
<script src="../backend/scripts.js" defer></script>
<script src="search-script.js"></script>
</html>
