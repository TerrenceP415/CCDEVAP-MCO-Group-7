<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyEase | Booking</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="../backend/scripts.js" defer></script>
</head>

<body>
    <header>
    
        <nav class="nav">
            <h1 class="logo">Sky<span class="ease">Ease</span></h1>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="search.html">Search Flights</a></li>
                <li><a href="booking.html" class="current">Book Flights</a></li>
                <li><a href="reservations.html">My Reservations</a></li>
                <li><a href="profile.html">User Profile</a></li>
                <li><a href="admin-dashboard.html">Admin Panel</a></li>
                <li><a class="login" href="#">Login</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </nav>
    </header>

    <main class="booking-shell">
        <section class="booking-card">
            <p class="eyebrow">SkyEase</p>
            <h1><i class="bi bi-ticket-perforated"></i> Book Your Flight</h1>
            <p class="booking-copy">Fill in the passenger details below to complete your booking.</p>

            <form class="booking-form">
                <div class="booking-field">
                    <label for="last_name"><i class="bi bi-person"></i> Last Name</label>
                    <input type="text" id="last_name" name="last_name" placeholder="Enter last name">
                </div>

                <div class="booking-field">
                    <label for="first_name"><i class="bi bi-person"></i> First Name</label>
                    <input type="text" id="first_name" name="first_name" placeholder="Enter first name">
                </div>

                <div class="booking-field">
                    <label for="email_address"><i class="bi bi-envelope"></i> Email Address</label>
                    <input type="email" id="email_address" name="email_address" placeholder="Enter email address">
                </div>

                <div class="booking-field">
                    <label for="contact_number"><i class="bi bi-phone"></i> Contact Number</label>
                    <input type="text" id="contact_number" name="contact_number" placeholder="Enter contact number">
                </div>

                <div class="booking-field">
                    <label for="passport_number"><i class="bi bi-passport"></i> Passport Number</label>
                    <input type="text" id="passport_number" name="passport_number" placeholder="Enter passport number">
                </div>

                <div class="booking-field">
                    <label for="nationality"><i class="bi bi-flag"></i> Nationality</label>
                    <select name="nationality" id="nationality">
                        <option value="philippines">Philippines</option>
                        <option value="usa">United States</option>
                        <option value="canada">Canada</option>
                        <option value="uk">United Kingdom</option>
                        <option value="australia">Australia</option>
                    </select>
                </div>

                <div class="booking-field">
                    <label for="date_of_birth"><i class="bi bi-calendar"></i> Date of Birth</label>
                    <input type="date" id="date_of_birth" name="date_of_birth">
                </div>

                <div class="booking-field">
                    <label><i class="bi bi-gender-ambiguous"></i> Gender</label>
                    <div class="radio-group">
                        <label for="male">
                            <input type="radio" id="male" name="gender" value="male"> Male
                        </label>
                        <label for="female">
                            <input type="radio" id="female" name="gender" value="female"> Female
                        </label>
                    </div>
                </div>

                <div class="booking-field">
                    <label for="emergency_contact"><i class="bi bi-telephone"></i> Emergency Contact Number</label>
                    <input type="text" id="emergency_contact" name="emergency_contact" placeholder="Enter emergency contact">
                </div>

                <div class="booking-field">
                    <label for="meal_preference"><i class="bi bi-cup-hot"></i> Meal Preference</label>
                    <select name="meal_preference" id="meal_preference">
                        <option value="standard">Standard</option>
                        <option value="vegetarian">Vegetarian</option>
                        <option value="vegan">Vegan</option>
                        <option value="halal">Halal</option>
                        <option value="kosher">Kosher</option>
                        <option value="gluten_free">Gluten-Free</option>
                    </select>
                </div>

                <button type="submit" class="booking-submit">View Reservations</button>
            </form>
        </section>
    </main>
</body>
</html>
