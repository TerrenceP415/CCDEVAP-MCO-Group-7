<html>
<head>
    <title>Booking</title>
</head>

<body>
    <header>
    <h1 class="logo">Sky<span class="ease">Ease</span></h1>
        <nav class="nav">
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="search.html">Search Flights</a></li>
                <li><a href="booking.html">Book Flights</a></li>
                <li><a href="reservations.html">My Reservations</a></li>
                <li><a href="profile.html" class="current">User Profile</a></li>
                <li><a href="admin-dashboard.html">Admin Panel</a></li>
                <li><a class="login" href="#">Login</a></li>
            </ul>
        </nav>
    </header>

    <h1>Booking</h1>
    <form>
        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" name="last_name">
    <br><br>
        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" name="first_name">
    <br><br>
        <label for="email_address">Email Address:</label>
        <input type="email" id="email_address" name="email_address">
    <br><br>
        <label for="contact_number">Contact Number:</label>
        <input type="text" id="contact_number" name="contact_number">
    <br><br>
        <label for="passport_number">Passport Number:</label>
        <input type="text" id="passport_number" name="passport_number">
    <br><br>
        <label for="nationality">Nationality:</label>
        <select name="nationality" id="nationality">
            <option value="philippines">Philippines</option>
            <option value="usa">United States</option>
            <option value="canada">Canada</option>
            <option value="uk">United Kingdom</option>
            <option value="australia">Australia</option>
        </select>
    <br><br>
        <label for="date_of_birth">Date of Birth:</label>
        <input type="date" id="date_of_birth" name="date_of_birth">
    <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
    <br><br>
        <label for="emergency_contact">Emergency Contact Number:</label>
        <input type="text" id="emergency_contact" name="emergency_contact">
    <br><br>
        <label for="meal_preference">Meal Preference:</label>
        <select name="meal_preference" id="meal_preference">
            <option value="standard">Standard</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
            <option value="halal">Halal</option>
            <option value="kosher">Kosher</option>
            <option value="gluten_free">Gluten-Free</option>
        </select>
    <br><br>
        <button type="submit">View Reservations</button>
    </form>
</body>
</html>
